<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Financial Market Icon -->
  <rect width="64" height="64" fill="#141414"/>
  <rect x="2" y="2" width="60" height="60" stroke="#2a2a2a" stroke-width="2"/>
  
  <!-- Grid Lines -->
  <line x1="8" y1="48" x2="56" y2="48" stroke="#262626" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="8" y1="32" x2="56" y2="32" stroke="#262626" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="8" y1="16" x2="56" y2="16" stroke="#262626" stroke-width="1.5" stroke-dasharray="2 2"/>
  
  <!-- Financial Bars / Candlesticks -->
  <rect x="12" y="28" width="6" height="20" fill="#22c55e" opacity="0.85"/>
  <line x1="15" y1="22" x2="15" y2="52" stroke="#22c55e" stroke-width="1.5"/>
  
  <rect x="23" y="34" width="6" height="14" fill="#ef4444" opacity="0.85"/>
  <line x1="26" y1="30" x2="26" y2="50" stroke="#ef4444" stroke-width="1.5"/>
  
  <rect x="34" y="20" width="6" height="28" fill="#22c55e" opacity="0.85"/>
  <line x1="37" y1="14" x2="37" y2="52" stroke="#22c55e" stroke-width="1.5"/>
  
  <rect x="45" y="14" width="6" height="34" fill="#22c55e"/>
  <line x1="48" y1="8" x2="48" y2="54" stroke="#22c55e" stroke-width="1.5"/>

  <!-- Upward Trend Line Overlay -->
  <polyline points="10,40 22,34 33,26 44,18 55,10" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="55" cy="10" r="3" fill="#38bdf8"/>
</svg>
